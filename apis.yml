name: Secure Trust Bank
kind: company
description: >-
  Secure Trust Bank PLC is an award-winning UK specialist bank, founded in 1952
  in the West Midlands and headquartered in Solihull, providing savings accounts
  and specialist lending to over a million retail and business customers. It is a
  publicly listed company (London Stock Exchange: STB) rather than a mutual or
  building society, operating across Retail Finance (V12), Vehicle Finance,
  Real Estate Finance, Commercial Finance and personal Savings. It is authorised
  by the Prudential Regulation Authority and regulated by the Financial Conduct
  Authority and the PRA (FRN 204550). As a UK ASPSP under PSD2 and the CMA Open
  Banking framework, its account offerings sit against the Open Banking
  Implementation Entity (OBIE) standards - a public, unauthenticated Open Data
  reference surface (ATMs, branches, products) and the FAPI-secured Read/Write
  APIs for Account and Transaction Information, Payment Initiation and
  Confirmation of Funds. Secure Trust Bank is a specialist lender and not one of
  the nine CMA9-mandated banks; as of this review it publishes no public
  developer portal or bank-branded Open Banking developer host, so the API
  surfaces below reference the shared OBIE standard specifications the bank's
  regulated products conform to, not proprietary Secure Trust Bank API contracts.
