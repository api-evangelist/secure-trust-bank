apis:
- aid: secure-trust-bank:open-data-api
  name: Secure Trust Bank Open Data API (OBIE Standard)
  description: >-
    The UK Open Banking Open Data API - a public, unauthenticated reference-data
    surface for ATMs, branches and product information (Personal Current Accounts,
    Business Current Accounts, Unsecured SME Loans, Commercial Credit Cards, etc.)
    defined by the OBIE Open Data Standard v1.3. Represented here as the shared
    standard Secure Trust Bank's products conform to; no Secure Trust Bank Open
    Data host was confirmed live at review time.
  humanURL: https://openbankinguk.github.io/opendata-api-docs-pub/
  tags:
  - Open Data
  - Reference Data
  - ATMs
  - Branches
  - Products
  properties:
  - type: OpenAPI
    url: openapi/obie-open-data-standard-openapi.json
  - type: Documentation
    url: https://openbankinguk.github.io/opendata-api-docs-pub/
  - type: APIReference
    url: https://github.com/OpenBankingUK/opendata-api-spec-compiled
  - type: Overlay
    url: overlays/secure-trust-bank-open-data-overlay.yaml
- aid: secure-trust-bank:account-transaction-information-api
  name: Secure Trust Bank Account & Transaction Information API (OBIE Read/Write, AIS)
  description: >-
    The OBIE Read/Write Account and Transaction Information (AIS) API - FAPI-secured
    access to account, balance, transaction, standing order, direct debit and
    statement data with customer consent. FAPI-grade OAuth2/OIDC, mutual-TLS client
    authentication and PSD2 strong customer authentication apply; onboarding
    requires OBIE/eIDAS certificates. Represented here as the shared OBIE standard,
    not a proprietary Secure Trust Bank contract.
  humanURL: https://openbankinguk.github.io/read-write-api-site3/
  tags:
  - Account Information
  - AIS
  - Transactions
  - FAPI
  properties:
  - type: OpenAPI
    url: openapi/obie-account-info-standard-openapi.yaml
  - type: Documentation
    url: https://openbankinguk.github.io/read-write-api-site3/
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
  - type: Overlay
    url: overlays/secure-trust-bank-account-info-overlay.yaml
- aid: secure-trust-bank:payment-initiation-api
  name: Secure Trust Bank Payment Initiation API (OBIE Read/Write, PIS)
  description: >-
    The OBIE Read/Write Payment Initiation (PIS) API - FAPI-secured initiation of
    domestic, scheduled, standing-order, international and file payments on behalf
    of a consenting customer, with PSD2 strong customer authentication. Represented
    here as the shared OBIE standard, not a proprietary Secure Trust Bank contract.
  humanURL: https://openbankinguk.github.io/read-write-api-site3/
  tags:
  - Payment Initiation
  - PIS
  - Payments
  - FAPI
  properties:
  - type: OpenAPI
    url: openapi/obie-payment-initiation-standard-openapi.yaml
  - type: Documentation
    url: https://openbankinguk.github.io/read-write-api-site3/
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
  - type: Overlay
    url: overlays/secure-trust-bank-payment-initiation-overlay.yaml
- aid: secure-trust-bank:confirmation-of-funds-api
  name: Secure Trust Bank Confirmation of Funds API (OBIE Read/Write, CBPII)
  description: >-
    The OBIE Read/Write Confirmation of Funds (CBPII) API - FAPI-secured yes/no
    confirmation that funds are available on an account, for card-based payment
    instrument issuers, under PSD2 strong customer authentication. Represented here
    as the shared OBIE standard, not a proprietary Secure Trust Bank contract.
  humanURL: https://openbankinguk.github.io/read-write-api-site3/
  tags:
  - Confirmation of Funds
  - CBPII
  - FAPI
  properties:
  - type: OpenAPI
    url: openapi/obie-confirmation-of-funds-standard-openapi.yaml
  - type: Documentation
    url: https://openbankinguk.github.io/read-write-api-site3/
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
  - type: Overlay
    url: overlays/secure-trust-bank-confirmation-of-funds-overlay.yaml
