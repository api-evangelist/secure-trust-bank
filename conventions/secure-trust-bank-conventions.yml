  client_auth: mutual-TLS (tls_client_auth / private_key_jwt); OBIE/eIDAS certificates required
  message_signing: detached JWS via x-jws-signature header on write requests
  sca: PSD2 Strong Customer Authentication via the PSU authorization-code flow
