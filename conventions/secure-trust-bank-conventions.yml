idempotency:
  supported: true
  header: x-idempotency-key
  scope: payment-order and consent write operations (PIS)
  max_length: 40
  retention: >-
    Per the OBIE standard an ASPSP persists the idempotency key for a minimum of
    24 hours; a repeated key with an identical payload returns the original result.
  note: >-
    Present on CreateDomesticPayments and the other payment-creation operations in
    the Payment Initiation spec; a mandatory field for POST payment resources.
